<!DOCTYPE html>
<html lang="en">
<!--
  ══════════════════════════════════════════════════════════════════════════
   SINAI FIELD — Production Readings                       PETROBEL
  ══════════════════════════════════════════════════════════════════════════

   Hourly PETRECO and Ras Gara readings for one shift day, and the difference
   between them. One self-contained file — edit it directly, no build step.

   This application stands alone. It has its own Firebase project, its own
   accounts and its own release cycle, and it shares nothing with any other
   PETROBEL app. Nothing here should ever need to reach outside this folder.

   WHAT IS WHERE                                                    (approx.)
   ─────────────────────────────────────────────────────────────────────────
     CSS
       Design tokens — every colour lives here, light + dark ........ line 62
       Header, login, toast, footer ................................ line 95
       The readings page: table, inputs, cards, chart .............. line 202
     MARKUP
       Icon sprite — every icon, drawn inline ..................... line 280
       Login screen .............................................. line 298
       Header bar ................................................ line 319
       The readings page ......................................... line 331
     SCRIPT 1 — the shell
       ►► CONFIGURATION — Firebase config + who is admin/petreco/rasgara . line 387
       Boot, helpers, chart colours .............................. line 430
       Sign in / sign out, roles ................................. line 536
     SCRIPT 2 — the application
       Readings, totals, chart, printed report, PDF, cloud sync ... line 650
     SCRIPT 3 — the extras
       Day / night theme ......................................... line 1494
       Service worker registration ............................... line 1521

   THE THREE ROLES
     admin    both columns, the difference, the chart, print and e-mail
     petreco  the PETRECO column and its own total, nothing else
     rasgara  the Ras Gara columns and its own total, nothing else

   TO CHANGE WHO CAN SIGN IN
     Edit ADMIN_EMAILS / PETRECO_EMAILS / PLANT_EMAILS in the CONFIGURATION
     block AND the matching functions in firestore.rules. They are two halves
     of one decision — change one without the other and saving fails silently.

   BEFORE YOU RELEASE
     Bump CACHE_NAME in sw.js. Otherwise nobody sees your change.

   See DEVELOPER_REFERENCE.md for the things that will bite you.
  ══════════════════════════════════════════════════════════════════════════
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b3d68">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sinai Field">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="PETROBEL Sinai Field — hourly production readings, PETRECO vs Ras Gara">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sinai Field — Production Readings</title>
<style>
/* Fonts: local-first, no download. Same decision as the Wells app — bundling a
   web face would cost ~300 KB and break the offline guarantee, which matters
   more at a plant than the typeface does. */
@font-face { font-family:'Inter'; src:local('Inter'),local('Inter Regular'),local('Inter-Regular'); font-weight:300 700; font-display:swap; }
@font-face { font-family:'JetBrains Mono'; src:local('JetBrains Mono'),local('JetBrainsMono'),local('JetBrains Mono Regular'); font-weight:400 700; font-display:swap; }

/* ── Tokens ─────────────────────────────────────────────────────────────
   Light is the default; dark is a deliberate second palette, not a flip —
   each mode's values are chosen, never derived by inverting the other. */
:root{
  --bg:#0a1420; --surface:#0f1e2e; --card:#14273a; --border:#22405c;
  --accent:#59a5e8; --accent2:#e0b95f; --green:#34c98a; --yellow:#f0c05a;
  --red:#ef7a86; --text:#e6eef7; --muted:#8aa4bd; --gold:#e0b95f;
  --on-accent:#06131f; --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --ring:rgba(89,165,232,.30); --shadow:0 4px 16px rgba(0,0,0,.42);
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-num:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
body.light-mode{
  --bg:#eef3f8; --surface:#ffffff; --card:#f7fafd; --border:#dbe4ee;
  --accent:#0b3d68; --accent2:#a9822f; --green:#1d6b3f; --yellow:#8a6212;
  --red:#b03a48; --text:#16232f; --muted:#5d7286; --gold:#c8a34a;
  --on-accent:#ffffff; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --ring:rgba(11,61,104,.18); --shadow:0 2px 10px rgba(15,40,70,.07);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-ui);
  min-height:100%; display:flex; flex-direction:column; overflow-x:hidden;
}

/* ── Icons ──────────────────────────────────────────────────────────── */
.ico{ width:1.15em; height:1.15em; flex:0 0 auto; vertical-align:-.19em; fill:none; stroke:currentColor; }
.ico-h{ width:1.05em; height:1.05em; vertical-align:-.13em; color:var(--accent); }
.ico-lg{ width:20px; height:20px; vertical-align:-.28em; }
.ico-xl{ width:52px; height:52px; vertical-align:middle; opacity:.5; color:var(--accent); }

/* ── Header ─────────────────────────────────────────────────────────── */
.app-header{
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:linear-gradient(180deg,var(--surface),var(--card));
  border-bottom:1px solid var(--border); box-shadow:var(--shadow);
  position:sticky; top:0; z-index:40;
}
body.light-mode .app-header{ border-bottom:3px solid var(--gold); }
/* flex:0 0 auto on the mark and 1 1 auto on the email: the address is the
   only thing here that can afford to be truncated, so it is the only thing
   allowed to shrink. Without this the mark was squeezed below its content
   width and the nowrap wordmark spilled across the address. */
.ub-mark{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
.ub-mark .ico{ width:22px; height:22px; color:var(--accent); }
.ub-title{ font-size:13px; font-weight:800; letter-spacing:-.01em; white-space:nowrap; }
.ub-email{ font-size:11px; color:var(--muted); font-family:var(--font-num);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  flex:1 1 auto; min-width:0; text-align:right; }
/* Below ~430px there is not room for both the wordmark and the address. The
   page heading underneath carries the page name, so the wordmark goes. */
@media (max-width:430px){ .ub-title{ display:none; } }
.ub-role{ font-size:10px; font-weight:800; letter-spacing:1px; color:var(--accent);
  font-family:var(--font-num); white-space:nowrap; }
.theme-toggle{ display:inline-flex; align-items:center; justify-content:center;
  background:transparent; border:1px solid var(--border); border-radius:9px;
  width:34px; height:32px; color:var(--accent2); cursor:pointer; }
.ub-logout{ background:var(--surface); border:1.5px solid var(--border); border-radius:9px;
  color:var(--text); font-size:10px; font-weight:700; letter-spacing:1px;
  padding:8px 10px; cursor:pointer; font-family:var(--font-num); }

/* ── Page header ────────────────────────────────────────────────────── */
.page-hdr{ padding:14px 14px 12px; border-bottom:1px solid var(--border); background:var(--surface); }
.page-hdr h2{ font-size:19px; font-weight:800; letter-spacing:-.02em; color:var(--accent);
  display:flex; align-items:center; gap:9px; }
.page-hdr p{ font-size:12.5px; color:var(--muted); margin-top:4px; }

/* ── Controls: everything tappable LOOKS tappable ─────────────────────
   This is the whole reason the Wells redesign happened; the rule is carried
   over verbatim so the split cannot reintroduce the invisible-field bug. */
input[type=text],input[type=number],input[type=date],input[type=email],
input[type=password],input[type=file],select,textarea{
  background:var(--surface); border:1.5px solid var(--border); border-radius:10px;
  color:var(--text); padding:10px 11px; font-family:var(--font-num); font-size:13px;
  transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--ring);
}
input::placeholder{ color:var(--muted); opacity:.75; }
button{ font-family:inherit; cursor:pointer; }
button:active{ transform:translateY(1px); }

/* ── Login ──────────────────────────────────────────────────────────── */
#login-page{
  position:fixed; inset:0; z-index:200; background:var(--bg);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
#login-page.hidden{ display:none; }
.login-card{
  width:100%; max-width:380px; background:var(--card); border:1px solid var(--border);
  border-radius:16px; padding:26px 22px; box-shadow:var(--shadow);
}
body.light-mode .login-card{ border-top:4px solid var(--gold); }
.login-logo{ text-align:center; margin-bottom:18px; }
.login-logo img{ width:72px; height:72px; border-radius:16px; object-fit:cover; }
.login-logo h1{ font-size:19px; font-weight:800; letter-spacing:1px; margin-top:10px; }
.login-logo p{ font-size:12px; color:var(--muted); font-family:var(--font-num); margin-top:3px; }
.login-field{ margin-bottom:13px; }
.login-field label{ display:block; font-size:10px; letter-spacing:1px; text-transform:uppercase;
  color:var(--muted); font-family:var(--font-num); margin-bottom:6px; }
.login-field input{ width:100%; }
.login-btn{
  width:100%; background:var(--accent); color:var(--on-accent); border:1px solid var(--accent);
  border-radius:11px; padding:13px; font-size:15px; font-weight:700; letter-spacing:.3px;
  box-shadow:0 3px 10px var(--ring); margin-top:6px;
}
body.light-mode .login-btn{ color:#fff; }
.login-btn:disabled{ opacity:.55; cursor:not-allowed; }
.login-error{ color:var(--red); font-size:12px; margin-top:10px; min-height:16px; text-align:center; }

/* ── Toast ──────────────────────────────────────────────────────────── */
#toast{
  position:fixed; left:50%; bottom:22px; transform:translate(-50%,80px);
  background:var(--card); color:var(--text); border:1px solid var(--border);
  border-left:3px solid var(--accent); border-radius:10px; padding:11px 15px;
  font-size:13px; max-width:88vw; box-shadow:var(--shadow); z-index:300;
  opacity:0; transition:transform .22s, opacity .22s; pointer-events:none;
}
#toast.show{ transform:translate(-50%,0); opacity:1; }
#toast.warn{ border-left-color:var(--yellow); }

/* "your PDF is ready" sheet — see rgOfferPdf() for why this exists */
#pdfSheet{position:fixed;inset:0;z-index:400;display:none;align-items:flex-end;
  background:rgba(8,20,32,.45);}
#pdfSheet.show{display:flex;}
#pdfSheet .box{background:var(--card);border-top:3px solid var(--gold,#c8a34a);
  border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  width:100%;box-shadow:0 -6px 26px rgba(8,20,32,.3);}
#pdfSheet h4{font-size:15px;font-weight:800;margin-bottom:3px;color:var(--text);}
#pdfSheet .fn{font-size:11.5px;color:var(--muted);font-family:var(--font-num);
  margin-bottom:13px;word-break:break-all;}
#pdfSheet .row{display:flex;flex-direction:column;gap:8px;}
#pdfSheet .row .rg-btn{width:100%;justify-content:center;}

/* ── Footer ─────────────────────────────────────────────────────────── */
.app-footer{
  margin-top:auto; text-align:center; padding:16px; font-size:12px;
  color:var(--muted); font-family:var(--font-num);
  border-top:1px solid var(--border); background:var(--surface);
}
.cloud-line{ font-size:11px; color:var(--muted); font-family:var(--font-num);
  display:flex; align-items:center; justify-content:center; gap:5px; margin-bottom:5px; }
.foot-by{ margin-top:4px; font-size:11px; color:var(--muted); }
.foot-by span{ color:var(--accent); font-weight:700; }

#swUpdateBanner{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:250;
  background:var(--accent); color:var(--on-accent); padding:12px 14px;
  font-size:13px; text-align:center; cursor:pointer;
}
body.light-mode #swUpdateBanner{ color:#fff; }

/* ── Ras Gara page ─────────────────────────────────────────────────── */

/* ── Ras Gara tab ─────────────────────────────────────────────────────── */
.rg-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.rg-lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-family:var(--font-num);}
.rg-date{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);
  padding:7px 9px;font-size:13px;font-family:var(--font-num);}
.rg-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:11px;color:var(--text);
  padding:9px 13px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;}
.rg-btn:active{transform:translateY(1px);}
.rg-btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700;
  box-shadow:0 3px 10px var(--ring);}
body.light-mode .rg-btn-primary{color:#fff !important;}
.rg-saved{font-size:11px;color:var(--muted);margin-left:auto;font-family:var(--font-num);}
.rg-hint{font-size:11px;color:var(--muted);margin:2px 0 10px;}
.rg-range{display:flex;gap:7px;flex-wrap:wrap;}
.rg-range button{background:transparent;border:1.5px solid var(--border);border-radius:9px;
  color:var(--muted);padding:6px 13px;font-size:11.5px;font-weight:700;cursor:pointer;
  font-family:var(--font-num);letter-spacing:.4px;}
.rg-range button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
body.light-mode .rg-range button.on{color:#fff;}

/* ── Daily record header ──────────────────────────────────────────────
   A titled panel rather than the bare uppercase label the other sections
   use: this one opens a whole second view (a range, a chart, a table and
   its own printout), so it needs to say what it is covering. The day count
   lives HERE, which is what lets the range chips read "All" instead of
   "All 3" — a number inside a button label looks like part of the choice. */
.rg-rec-head{background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);margin:26px 0 12px;overflow:hidden;}
.rg-rec-head .bar{height:3px;background:linear-gradient(90deg,var(--accent) 0%,var(--gold) 100%);}
.rg-rec-head .in{padding:13px 15px;}
.rg-rec-head .row{display:flex;align-items:flex-start;gap:10px;}
.rg-rec-head .ico{width:17px;height:17px;color:var(--gold);margin-top:2px;}
.rg-rec-head h3{font-size:15.5px;font-weight:800;letter-spacing:-.01em;color:var(--text);line-height:1.25;}
.rg-rec-head .sub{font-size:11.5px;color:var(--muted);font-family:var(--font-num);margin-top:3px;
  line-height:1.45;}
.rg-rec-head .sub b{color:var(--text);font-weight:700;}
.rg-rec-head .chips{margin-top:11px;padding-top:11px;border-top:1px solid var(--border);}
.rg-rec-head .chips:empty{display:none;}
.rg-cust{margin-top:11px;padding-top:11px;border-top:1px dashed var(--border);}
.rg-cust .fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;}
.rg-cust label{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);
  font-family:var(--font-num);}
.rg-cust select,.rg-cust input{width:100%;background:var(--surface);border:1.5px solid var(--border);
  border-radius:9px;color:var(--text);padding:8px 9px;font-size:12.5px;font-family:var(--font-num);}
.rg-cust select:focus,.rg-cust input:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--ring);}
.rg-cust .or{font-size:10.5px;color:var(--muted);text-align:center;margin:9px 0 7px;
  font-family:var(--font-num);letter-spacing:.5px;}
.rg-cust .pair{display:flex;gap:9px;}
.rg-sec-title{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);
  font-family:var(--font-num);margin:22px 0 8px;}
.rg-tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:13px;background:var(--surface);
  box-shadow:var(--shadow);}
table.rg-tbl{width:100%;border-collapse:collapse;font-family:var(--font-num);font-size:12px;min-width:520px;
  font-variant-numeric:tabular-nums;}
table.rg-tbl td{vertical-align:middle;}
/* The plant view is three columns, not five; the 520px floor was sized for the
   comparison and pushed its Cumulative column off a phone screen. */
body.rg-own-side table.rg-tbl{min-width:0;}
/* Same reason for the daily record: four short columns, and the 520px floor
   pushed Difference — the column the whole page exists for — off the screen. */
#rgHistory table.rg-tbl{min-width:0;font-size:11.5px;}
#rgHistory table.rg-tbl th,#rgHistory table.rg-tbl td{padding:6px 4px;}
#rgHistory table.rg-tbl td:first-child{text-align:left;padding-left:10px;}
body.rg-own-side .rg-in{width:100%;max-width:110px;}
table.rg-tbl th{position:sticky;top:0;background:var(--card);color:var(--muted);font-size:10px;
  letter-spacing:.5px;text-transform:uppercase;padding:7px 6px;border-bottom:1px solid var(--border);text-align:center;font-weight:600;}
table.rg-tbl th.rg-grp{color:var(--s1);border-bottom:2px solid var(--s1);}
table.rg-tbl th.rg-grp2{color:var(--s2);border-bottom:2px solid var(--s2);}
table.rg-tbl td{padding:3px 6px;border-bottom:1px solid rgba(148,163,184,.12);text-align:center;color:var(--text);}
table.rg-tbl tbody tr:nth-child(odd){background:rgba(56,189,248,0.07);}
.rg-time{color:var(--muted);white-space:nowrap;}
/* A visible frame AT REST is the point. An earlier version used
   `border:1px solid transparent` revealed on :hover — and a phone has no
   hover, so the field only appeared once you had already tapped it, and the
   operators could not tell which cells were typeable. Keep the frames. */
.rg-in{width:82px;background:var(--surface);border:2px solid var(--border);border-radius:10px;
  color:var(--text);padding:9px 6px;font-size:13.5px;font-weight:700;
  font-family:var(--font-num);text-align:center;
  box-shadow:inset 0 1px 3px rgba(15,40,70,.07);}
body:not(.light-mode) .rg-in{box-shadow:inset 0 2px 5px rgba(0,0,0,.35);}
.rg-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);}
.rg-in:disabled{background:var(--card);color:var(--muted);border-style:dashed;opacity:1;cursor:not-allowed;}
.rg-in.rg-dirty{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(200,163,74,.22);}
/* NOTE: .rg-calc sits ON the <td>. Do not change its `display` — an
   inline-block table cell leaves table layout and the value drifts out of its
   row. It is told apart from an input by colour and ground, not by a box:
   inputs are white with a 2px frame, calculated cells are muted on the card. */
td.rg-calc{color:var(--muted);font-family:var(--font-num);font-variant-numeric:tabular-nums;
  background:var(--card);font-size:12.5px;}
.rg-tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px;}
.rg-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;}
.rg-card .k{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-family:var(--font-num);}
.rg-card .v{font-size:20px;font-weight:700;margin-top:3px;font-family:var(--font-num);}
.rg-card .s{font-size:11px;color:var(--muted);margin-top:1px;font-family:var(--font-num);}
.rg-card.petreco .v{color:var(--s1);}
.rg-card.rasgara .v{color:var(--s2);}
.rg-card.loss .v{color:var(--red);}
.rg-card.gain .v{color:var(--green);}
/* The difference is the number being watched, so it is highlighted rather than
   merely tinted: RED = more metered at Ras Gara than PETRECO received. */
.rg-card.loss{background:rgba(176,58,72,.10);border-color:var(--red);}
.rg-card.gain{background:rgba(29,107,63,.10);border-color:var(--green);}
body:not(.light-mode) .rg-card.loss{background:rgba(239,122,134,.13);}
body:not(.light-mode) .rg-card.gain{background:rgba(52,201,138,.12);}
.rg-card.loss .k, .rg-card.gain .k{font-weight:700;}
.rg-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.rg-actions .rg-btn{flex:1;min-width:150px;padding:11px 12px;font-size:13px;}
.rg-empty{color:var(--muted);font-size:13px;text-align:center;padding:26px 10px;}
.rg-legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px;font-size:11px;
  color:var(--muted);font-family:var(--font-num);}
.rg-legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}

</style>
</head>

<!-- ══ Icon sprite ══════════════════════════════════════════════════════
     Stroke-only on a 24 grid so they inherit currentColor and follow the
     theme. NOTE: a <use> reference does not resolve inside a detached
     document, so the printed report and the e-mailed PDF carry their own
     inline markup — do not "tidy" them to use the sprite. ══════════════ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
