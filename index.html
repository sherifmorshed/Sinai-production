<script>
// ══════════════════════════════════════════════════════════════════════
//  CONFIGURATION — the only block you should need to edit
// ══════════════════════════════════════════════════════════════════════
//
// Paste this project's web config here: Firebase Console → Project settings →
// General → Your apps → Web app → Config. Take the values only — ignore the
// `import` / `initializeApp` lines the console shows around them; the SDK is
// already loaded from the local firebase-*-compat.js files.
//
// Nothing in this file is a secret. A Firebase web config is public by design —
// it identifies the project, it does not authorise anything. What actually
// protects the data is the security rules in firestore.rules plus the accounts
// you create. Do not skip publishing those rules.
//
// The console shows this project as "Sinai-Production"; its ID is
// `production-hourly`. That is not a mismatch — a Firebase project ID is fixed
// at creation and only the display name can be changed afterwards. Everything
// in code, including the rules, addresses the ID.
const firebaseConfig = {
  apiKey:            "AIzaSyAvBP0olyGyeKq4IAxyLOnFZbvAu4IAZig",
  authDomain:        "production-hourly.firebaseapp.com",
  projectId:         "production-hourly",
  storageBucket:     "production-hourly.firebasestorage.app",
  messagingSenderId: "994505777551",
  appId:             "1:994505777551:web:940a4405a580fde1966bfa"
};

// Who is who. Lower-case; compared case-insensitively.
//
// ADMIN   — PETROBEL. Sees and edits both sides, the chart, print and e-mail.
// PLANT   — Ras Gara operators. Their own two columns and their own total only.
// PETRECO — PETRECO operators. Their own M3/hr column and their own total only.
//           Their Cumulative stays calculated — it is a running total, never typed.
//
// Anyone who signs in successfully but is in NEITHER list is treated as a
// read-only viewer: they can look, they cannot type. That is deliberate — an
// account added in the Firebase console by mistake should not gain write access
// just by existing. The security rules enforce the same split server-side; this
// list only decides what the screen offers.
const ADMIN_EMAILS   = ['sherifmorshed@gmail.com'];
const PLANT_EMAILS   = ['rasgara@petrobel.org'];
const PETRECO_EMAILS = ['petreco@petrobel.org'];

// ══════════════════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════════════════
let FIREBASE_OK = false;
let db = null, auth = null;
let currentUser = null;
let isAdmin = false;
let isRasGara = false;   // the Ras Gara plant operators
let isPetreco = false;   // the PETRECO operators

try {
  if (typeof firebase === 'undefined') throw new Error('Firebase SDK did not load');
  if (String(firebaseConfig.apiKey).indexOf('PASTE_') === 0) {
    throw new Error('Firebase config has not been filled in yet — see SETUP.md');
  }
  firebase.initializeApp(firebaseConfig);
  db   = firebase.firestore();
  auth = firebase.auth();
  db.enablePersistence({ synchronizeTabs:true }).catch(function(){ /* multi-tab or unsupported: fine */ });
  FIREBASE_OK = true;
} catch (e) {
  console.error('[boot]', e.message);
  window.__BOOT_ERROR__ = e.message;
}

// ── Helpers the application below expects from this shell ───────────────
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return escHtml(s).replace(/'/g,'&#39;'); }

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }
  catch(e){ showToast('Storage unavailable — this entry may not survive a reload', true); return false; } }
function lsRemove(k){ try{ localStorage.removeItem(k); return true; }catch(e){ return false; } }

function getSyncedVersion(k){ const v=lsGet(k); const n=v?Number(v):0; return isNaN(n)?0:n; }
function setSyncedVersion(k,ts){ if(ts) lsSet(k,String(ts)); }
// True when this device already holds the exact cloud version, so the download
// can be skipped. `hasLocalData` guards the case where the stamp survived but
// the cached payload did not (partially cleared storage).
function isCacheCurrent(k, cloudTs, hasLocalData){
  return !!cloudTs && hasLocalData && getSyncedVersion(k) === cloudTs;
}
// This app stores one small document per day, so it will not approach the
// localStorage budget for years. The check is kept anyway: it is three lines,
// and the failure it catches (a silent write failure that looks like a
// successful save until the page reloads) is a nasty one to debug in the field.
const LS_BUDGET_BYTES = 5 * 1024 * 1024;
let _storageWarned = false;
function checkStorageHeadroom(){
  if(_storageWarned) return;
  let used = 0;
  try { for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
        used += k.length + (localStorage.getItem(k)||'').length; } }
  catch(e){ return; }
  if(used / LS_BUDGET_BYTES >= 0.8){
    _storageWarned = true;
    showToast('Offline storage ' + Math.round(used/LS_BUDGET_BYTES*100) + '% full', true);
  }
}

// Local-calendar ISO date. Uses local getters on purpose: this is only ever
// called on a `new Date()` representing "now", where local IS the intended
// day. Never feed it a UTC-midnight value — that is the bug that cost the
// Wells app three separate releases to track down.
function _isoDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}

let _toastTimer = null;
function showToast(msg, warn){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = String(msg);
  el.className = 'show' + (warn ? ' warn' : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ el.className = ''; }, 3200);
}

// Save a Blob to the user's device.
// Revoking the object URL synchronously after click() cancels the download in
// some browsers before they have finished reading the blob, so it is deferred.
function _downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 60000);
}

function updateCloudStatus(status, text){
  const el = document.getElementById('cloud-sync-status');
  if(!el) return;
  const colors = { synced:'var(--green)', syncing:'var(--yellow)', offline:'var(--red)', error:'var(--red)' };
  const icons  = { synced:'cloud', syncing:'refresh', offline:'cloud', error:'warn' };
  el.innerHTML = '<svg class="ico" aria-hidden="true"><use href="#i-' + (icons[status]||'cloud') + '"/></svg> ' +
                 escHtml(text);
  el.style.color = colors[status] || 'var(--muted)';
}

// ── Chart series colours ───────────────────────────────────────────────
// Resolved from the live tokens, never hard-coded, so the chart follows the
// theme. PRINT_SERIES is the light-mode set and is what the printed report and
// the PDF must use: those render in a DETACHED document where var(--…) does not
// resolve, and an unresolved colour paints black.
const PRINT_SERIES     = { s1:'#2a78d6', s2:'#eb6834', s3:'#1baf7a' };
const _SERIES_FALLBACK = { s1:'#3987e5', s2:'#d95926', s3:'#199e70' };
function seriesColor(slot, forPrint){
  if(forPrint) return PRINT_SERIES[slot] || PRINT_SERIES.s1;
  try {
    const v = getComputedStyle(document.body).getPropertyValue('--' + slot).trim();
    if(v) return v;
  } catch(e){}
  return _SERIES_FALLBACK[slot] || _SERIES_FALLBACK.s1;
}

// ══════════════════════════════════════════════════════════════════════
//  AUTH
// ══════════════════════════════════════════════════════════════════════
function _roleOf(email){
  const e = String(email||'').toLowerCase().trim();
  return { admin:   ADMIN_EMAILS.indexOf(e)   !== -1,
           plant:   PLANT_EMAILS.indexOf(e)   !== -1,
           petreco: PETRECO_EMAILS.indexOf(e) !== -1 };
}

function showApp(user){
  const r = _roleOf(user.email);
  currentUser = { email:user.email, name:String(user.email).split('@')[0], uid:user.uid };
  isAdmin    = r.admin;
  isRasGara  = r.plant;
  isPetreco  = r.petreco;

  document.getElementById('login-page').classList.add('hidden');
  document.getElementById('appHeader').style.display = 'flex';
  document.getElementById('app-body').style.display  = '';
  document.getElementById('appFooter').style.display = '';
  document.getElementById('ubEmail').textContent = user.email;
  document.getElementById('ubRole').textContent  =
    isAdmin ? 'ADMIN' : isRasGara ? 'RAS GARA' : isPetreco ? 'PETRECO' : 'VIEWER';

  console.log('[auth] ' + user.email + ' — ' +
              (isAdmin?'ADMIN':isRasGara?'RAS GARA':isPetreco?'PETRECO':'VIEWER'));
  if(typeof window.refreshRasGaraPage === 'function') window.refreshRasGaraPage();
  if(typeof window.startRasGaraListener === 'function') window.startRasGaraListener();
}

function showLogin(){
  currentUser = null; isAdmin = false; isRasGara = false; isPetreco = false;
  if(typeof window.stopRasGaraListener === 'function') window.stopRasGaraListener();
  document.getElementById('login-page').classList.remove('hidden');
  document.getElementById('appHeader').style.display = 'none';
  document.getElementById('app-body').style.display  = 'none';
  document.getElementById('appFooter').style.display = 'none';
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  if(!FIREBASE_OK){
    if(btn) btn.disabled = true;
    if(err) err.textContent = window.__BOOT_ERROR__ || 'Cannot reach the sign-in service.';
  }
}

function handleLogin(){
  const emailEl = document.getElementById('loginEmail');
  const passEl  = document.getElementById('loginPassword');
  const errEl   = document.getElementById('loginError');
  const btn     = document.getElementById('loginBtn');
  const email = (emailEl.value||'').trim();
  const pass  = passEl.value||'';
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Enter your email and password.'; return; }
  if(!FIREBASE_OK){ errEl.textContent = window.__BOOT_ERROR__ || 'Sign-in unavailable.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
    .then(function(){ return auth.signInWithEmailAndPassword(email, pass); })
    .then(function(){ passEl.value = ''; })
    .catch(function(e){
      // Firebase's own strings leak whether an address exists; map them.
      const map = {
        'auth/invalid-email'      : 'That does not look like an email address.',
        'auth/user-disabled'      : 'This account has been disabled.',
        'auth/network-request-failed': 'No connection — check the network and try again.',
        'auth/too-many-requests'  : 'Too many attempts. Wait a minute and try again.'
      };
      errEl.textContent = map[e.code] || 'Wrong email or password.';
      console.warn('[auth]', e.code);
    })
    .finally(function(){ btn.disabled = false; btn.textContent = 'Sign In'; });
}

function handleLogout(){
  if(!FIREBASE_OK){ showLogin(); return; }
  auth.signOut().catch(function(e){ console.warn('[auth] signOut', e); });
}

// ── Boot gate ──────────────────────────────────────────────────────────
// onAuthStateChanged can fire before the rest of the document has parsed.
// If it does, showApp() runs against elements that do not exist yet and the
// app dies silently on a blank screen. Hold the first auth event until the
// DOM is ready. (This exact race cost the Wells app a release; not repeating it.)
let _appReady = (document.readyState === 'interactive' || document.readyState === 'complete');
let _pendingUser, _hasPending = false;

function _apply(user){ if(user) showApp(user); else showLogin(); }

function _onAuthState(user){
  if(_appReady) _apply(user);
  else { _pendingUser = user; _hasPending = true; }
}

if(!_appReady){
  document.addEventListener('DOMContentLoaded', function(){
    _appReady = true;
    if(_hasPending){ _hasPending = false; const u = _pendingUser; _pendingUser = undefined; _apply(u); }
  });
}

if(FIREBASE_OK) auth.onAuthStateChanged(_onAuthState);
else document.addEventListener('DOMContentLoaded', showLogin);

document.addEventListener('DOMContentLoaded', function(){
  ['loginEmail','loginPassword'].forEach(function(id){
    const el = document.getElementById(id);
    if(el) el.addEventListener('keydown', function(e){ if(e.key === 'Enter') handleLogin(); });
  });
});

</script>

<!-- ══ RAS GARA — the application itself ══════════════════════════ -->
<script>
// ── THE APPLICATION ────────────────────────────────────────────────────
// Everything below is the readings page: entry, totals, chart, printed
// report, PDF and cloud sync.
//
// It expects these from the shell script above:
//   db, firebase, FIREBASE_OK, currentUser
//   isAdmin, isRasGara, isPetreco          role flags
//   escHtml, escAttr, showToast, updateCloudStatus
//   seriesColor, _isoDate
//   lsGet/lsSet, getSyncedVersion/setSyncedVersion/isCacheCurrent
//   checkStorageHeadroom, html2canvas

(function(){
  // Ras Gara is a plant ~100 km from PETRECO. Both sides meter the same
  // production independently every hour; the difference is the transport loss.
  //
  // Data entry, per the two parties who actually take the readings:
  //   PETRECO m3/hr  → typed by PETROBEL; the cumulative column is DERIVED
  //                    from it (running total), never typed.
  //   Ras Gara m3/hr AND cumulative → both typed by the Ras Gara operator,
  //                    because their meter reports both independently.
  //
  // A "day" is the operating shift: 24 rows from 06:00 through 05:00 the
  // following morning, matching the most recent sheets in Ras Gara Test 2026.
  const RG_COL   = 'rasGara';
  const RG_META  = { col:'rasGaraMeta', doc:'info' };
  const RG_LS    = 'rasgara_days_v1';
  const RG_VERK  = 'rasgara_days_v1__syncver';
  const RG_START_HOUR = 6;
  const RG_HOURS = 24;
  const M3_TO_BBL = 6.3;           // the factor used in the source workbook

  let RG_DAYS = (function(){ try { return JSON.parse(lsGet(RG_LS) || '{}') || {}; } catch(e){ return {}; } })();
  let _rgDate = null;              // yyyy-mm-dd of the shift currently open
  let _rgMetaUnsub = null, _rgLastTs = 0, _rgFirstSnap = true, _rgSkipNext = false;
  let _rgSaveTimer = null;

  // ── helpers ─────────────────────────────────────────────────────────────
  function rgHourLabel(i){
    const h = (RG_START_HOUR + i) % 24;
    return String(h).padStart(2,'0') + ':00';
  }
  // Rows from 06:00 onward belong to the shift date; rows past midnight belong
  // to the next calendar day. Shown so nobody has to work it out.
  function rgRowDate(dateStr, i){
    const rolls = (RG_START_HOUR + i) >= 24;
    if(!rolls) return dateStr;
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    return _isoDate(d);
  }
  function rgNum(v){
    if(v === '' || v == null) return null;
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  }
  function rgFmt(v, dp){
    if(v == null || isNaN(v)) return '—';
    const p = Math.pow(10, dp == null ? 1 : dp);
    return (Math.round(v * p) / p).toLocaleString('en-US');
  }
  // Magnitude of a signed figure whose sign is printed separately. Always use
  // this rather than rgFmt(Math.abs(v)) — Math.abs(null) is 0, so a difference
  // that does not exist would print as a confident "0" instead of "—".
  function rgAbs(v, dp){ return v == null ? '—' : rgFmt(Math.abs(v), dp); }
  function rgToday(){
    // Before the 06:00 shift start the "current" shift is still yesterday's.
    const now = new Date();
    if(now.getHours() < RG_START_HOUR) now.setDate(now.getDate() - 1);
    return _isoDate(now);
  }
  function rgBlankDay(dateStr){
    const rows = [];
    for(let i = 0; i < RG_HOURS; i++) rows.push({ p:null, r:null, rc:null });
    return { date:dateStr, startHour:RG_START_HOUR, rows:rows, updatedBy:'', updatedAt:0 };
  }
  function rgGetDay(dateStr){
    const d = RG_DAYS[dateStr];
    if(!d) return rgBlankDay(dateStr);
    // tolerate short/legacy rows
    const rows = [];
    for(let i = 0; i < RG_HOURS; i++){
      const s = (d.rows && d.rows[i]) || {};
      rows.push({ p:rgNum(s.p), r:rgNum(s.r), rc:rgNum(s.rc) });
    }
    return { date:dateStr, startHour:d.startHour || RG_START_HOUR, rows:rows,
             updatedBy:d.updatedBy || '', updatedAt:d.updatedAt || 0 };
  }

  // ── the calculations, exactly as the workbook does them ────────────────
  // ── the difference: sign and colour ─────────────────────────────────────
  // `loss` is PETRECO − Ras Gara, and it is displayed WITH ITS OWN SIGN
  // everywhere — the card, the printed report and the daily history column.
  // Those three must agree; an earlier version inverted the sign on the card
  // and printed "+143" where the history below it printed "−143".
  //
  //   loss < 0  →  Ras Gara metered MORE than PETRECO received  →  RED
  //                oil left Ras Gara that PETRECO cannot account for.
  //   loss > 0  →  PETRECO received at least what Ras Gara sent  →  GREEN
  //
  // Written down once here rather than inline three times. Do not "correct"
  // either the sign or the colour without re-reading this.
  function rgDiffIsBad(loss){ return loss != null && loss < 0; }
  function rgDiffClass(loss, badCls, goodCls){
    if(loss == null) return '';
    return rgDiffIsBad(loss) ? badCls : goodCls;
  }

  function rgCalc(day){
    let pTot = 0, rTot = 0, pAny = false, rAny = false;
    const pCum = [];
    let run = 0;
    for(let i = 0; i < RG_HOURS; i++){
      const row = day.rows[i];
      if(row.p != null){ run += row.p; pTot += row.p; pAny = true; pCum.push(run); }
      else pCum.push(null);
      if(row.r != null){ rTot += row.r; rAny = true; }
    }
    // PETRECO − Ras Gara. BOTH sides must have reported something, not either:
    // with only one side present the other's total is 0, and the difference
    // becomes the whole of the reporting side's day — a −186 m³ "loss" that is
    // really just a missing sheet. A comparison needs two numbers to compare.
    const loss = (pAny && rAny) ? (pTot - rTot) : null;
    return {
      pCum: pCum,
      pTotal: pAny ? pTot : null,
      rTotal: rAny ? rTot : null,
      pBbl: pAny ? pTot * M3_TO_BBL : null,
      rBbl: rAny ? rTot * M3_TO_BBL : null,
      loss: loss,
      lossBbl: loss == null ? null : loss * M3_TO_BBL,
      lossPct: (pAny && pTot > 0 && loss != null) ? (loss / pTot * 100) : null
    };
  }

  // ── permissions ─────────────────────────────────────────────────────────
  // Each side owns its own columns so neither plant can quietly restate the
  // other's meter reading — the whole point of the comparison is that the two
  // numbers are taken independently.
  // These read the top-level `let` bindings from the shell script. They must be
  // reached lexically with `typeof` guards, NOT as window.isAdmin — a top-level
  // `let` does not become a property of window the way `var` does, so the
  // window form silently reads undefined and every role collapses to viewer.
  function _admin(){   return typeof isAdmin   !== 'undefined' && isAdmin; }
  function _plant(){   return typeof isRasGara !== 'undefined' && isRasGara; }
  function _petreco(){ return typeof isPetreco !== 'undefined' && isPetreco; }

  // The admin can correct either side; each operator group only its own.
  function rgCanEditPetreco(){ return _admin() || _petreco(); }
  function rgCanEditRasGara(){ return _admin() || _plant(); }
  function rgReadOnly(){ return !rgCanEditPetreco() && !rgCanEditRasGara(); }

  // Which side of the comparison this user is here for:
  //   'both'     admin, and read-only viewers (they may look at everything)
  //   'petreco'  the PETRECO operators
  //   'rasgara'  the Ras Gara plant operators
  //
  // An operator sees ONLY their own figures — no other column, no comparison
  // total, no chart, no report buttons. Their job is to record their readings;
  // the comparison is PETROBEL's to make.
  //
  // NOTE this is presentation only. The rules let both accounts read the whole
  // rasGara/{date} document, so the other side's numbers are still fetchable
  // from a browser console. If either side ever has to be genuinely
  // confidential from the other, the day must be split into two documents —
  // the reasoning is in firestore.rules next to the rule it would change.
  function rgSide(){
    if(_admin())   return 'both';
    if(_petreco()) return 'petreco';
    if(_plant())   return 'rasgara';
    return 'both';
  }
  function rgOwnSideOnly(){ return rgSide() !== 'both'; }

  // ── row shape on the wire ───────────────────────────────────────────────
  // In memory `rows` is always a 24-element ARRAY — every render and
  // calculation depends on that and none of it changed.
  //
  // In Firestore it is a MAP keyed "0".."23". That is not decoration: a
  // Firestore array is one atomic value, so writing it always replaces the
  // whole thing, including the other side's readings. A map can be written
  // with merge:true and dotted paths, so each role writes only the fields it
  // owns. See rgPushToCloud for why that matters.
  //
  // Documents written before this change still hold an array, so reads accept
  // either shape. Writes always produce a map.
  function rgRowsToArray(raw){
    const out = [];
    for(let i = 0; i < RG_HOURS; i++){
      const r = (raw && (Array.isArray(raw) ? raw[i] : raw[String(i)])) || {};
      out.push({ p: r.p == null ? null : r.p,
                 r: r.r == null ? null : r.r,
                 rc: r.rc == null ? null : r.rc });
    }
    return out;
  }

  // ── table ───────────────────────────────────────────────────────────────
  function rgRenderTable(){
    const area = document.getElementById('rgTableArea');
    if(!area) return;
    const day = rgGetDay(_rgDate);
    const c   = rgCalc(day);
    const edP = rgCanEditPetreco(), edR = rgCanEditRasGara();
    const side = rgSide();
    const showP = (side === 'both' || side === 'petreco');
    const showR = (side === 'both' || side === 'rasgara');
    const cell = function(kind, i, val, dp, editable){
      return '<td>' + (editable
        ? '<input class="rg-in" inputmode="decimal" data-rg="' + kind + '" data-i="' + i +
          '" value="' + escAttr(val == null ? '' : val) + '">'
        : '<span class="rg-calc">' + rgFmt(val, dp) + '</span>') + '</td>';
    };
    let body = '';
    for(let i = 0; i < RG_HOURS; i++){
      const row = day.rows[i];
      let tds = '<td class="rg-time">' + escHtml(rgHourLabel(i)) + '</td>';
      // PETRECO's cumulative is DERIVED — a running total, never typed — so it
      // stays a calculated cell in every view, including PETRECO's own.
      if(showP) tds += cell('p', i, row.p, 2, edP) +
                       '<td class="rg-calc">' + rgFmt(c.pCum[i], 1) + '</td>';
      // Ras Gara type both: their meter reports the cumulative independently.
      if(showR) tds += cell('r',  i, row.r,  2, edR) +
                       cell('rc', i, row.rc, 1, edR);
      body += '<tr>' + tds + '</tr>';
    }
    const CUM_CALC = 'Cumulative<br><span style="font-weight:400;text-transform:none;">calculated</span>';
    let head;
    if(side === 'petreco'){
      head = '<tr><th></th><th class="rg-grp" colspan="2">PETRECO</th></tr>' +
             '<tr><th>Time</th><th>M3/hr</th><th>' + CUM_CALC + '</th></tr>';
    } else if(side === 'rasgara'){
      head = '<tr><th></th><th class="rg-grp2" colspan="2">RAS GARA</th></tr>' +
             '<tr><th>Time</th><th>M3/hr</th><th>Cumulative</th></tr>';
    } else {
      head = '<tr><th></th><th class="rg-grp" colspan="2">PETRECO</th><th class="rg-grp2" colspan="2">RAS GARA</th></tr>' +
             '<tr><th>Time</th><th>M3/hr</th><th>' + CUM_CALC + '</th>' +
             '<th>M3/hr</th><th>Cumulative</th></tr>';
    }
    area.innerHTML =
      '<div class="rg-tbl-wrap"><table class="rg-tbl">' +
        '<thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';

    const hint = document.getElementById('rgShiftHint');
    if(hint){
      const endDate = rgRowDate(_rgDate, RG_HOURS - 1);
      let who = rgReadOnly() ? 'You have read-only access.'
              : (edP && edR) ? 'You can enter both columns.'
              : edP ? 'You can enter the PETRECO M3/hr column — the cumulative is calculated for you.'
                    : 'You can enter the Ras Gara columns.';
      hint.textContent = 'Shift ' + rgHourLabel(0) + ' ' + _rgDate + '  →  ' +
                         rgHourLabel(RG_HOURS-1) + ' ' + endDate + '. ' + who;
    }
  }

  // ── totals ──────────────────────────────────────────────────────────────
  function rgRenderTotals(){
    const el = document.getElementById('rgTotals');
    if(!el) return;
    const c = rgCalc(rgGetDay(_rgDate));
    const side = rgSide();
    if(side !== 'both'){
      // An operator sees their own daily total and nothing else — no other
      // side's figure and no comparison.
      const own = side === 'petreco'
        ? { cls:'petreco', label:'PETRECO total', tot:c.pTotal, bbl:c.pBbl }
        : { cls:'rasgara', label:'Ras Gara total', tot:c.rTotal, bbl:c.rBbl };
      el.innerHTML = (own.tot == null)
        ? '<div class="rg-empty">No readings entered for this shift yet.</div>'
        : '<div class="rg-tot"><div class="rg-card ' + own.cls + '">' +
            '<div class="k">' + own.label + '</div><div class="v">' + rgFmt(own.tot,1) + '</div>' +
            '<div class="s">m³/d · ' + rgFmt(own.bbl,0) + ' bbl/d</div></div></div>';
      return;
    }
    if(c.pTotal == null && c.rTotal == null){
      el.innerHTML = '<div class="rg-empty">No readings entered for this shift yet.</div>';
      return;
    }
    const lossCls = rgDiffClass(c.loss, 'loss', 'gain');
    // Show `loss` with its OWN sign — do not invert it. The daily history
    // column prints the same number raw, and the two must agree.
    const lossSign = (c.loss == null) ? '' : (c.loss > 0 ? '+' : '−');
    el.innerHTML =
      '<div class="rg-tot">' +
        '<div class="rg-card petreco"><div class="k">PETRECO total</div><div class="v">' + rgFmt(c.pTotal,1) + '</div>' +
          '<div class="s">m³/d · ' + rgFmt(c.pBbl,0) + ' bbl/d</div></div>' +
        '<div class="rg-card rasgara"><div class="k">Ras Gara total</div><div class="v">' + rgFmt(c.rTotal,1) + '</div>' +
          '<div class="s">m³/d · ' + rgFmt(c.rBbl,0) + ' bbl/d</div></div>' +
        '<div class="rg-card ' + lossCls + '"><div class="k">Difference</div><div class="v">' + lossSign + rgAbs(c.loss,1) + '</div>' +
          '<div class="s">m³/d · ' + rgAbs(c.lossBbl,0) + ' bbl/d' +
          (c.lossPct == null ? '' : ' · ' + rgAbs(c.lossPct,1) + '%') +
          (c.loss == null ? '' : (c.loss > 0 ? ' less at Ras Gara' : ' more at Ras Gara')) + '</div></div>' +
      '</div>';
  }

  // ── chart: the workbook's line chart, Time vs Rate M3/hr ───────────────
  // Which indices get an x-axis label. Stepping blindly by `step` stops short:
  // over 24 hours a step of 3 ends at index 21 — 03:00 — so a shift that runs
  // to 05:00 looked like it ended two hours early. The LAST point always gets a
  // label; if that would crowd the previous one, it replaces it instead.
  function rgAxisMarks(n, step){
    const marks = [];
    for(let i = 0; i < n; i += step) marks.push(i);
    const last = n - 1;
    if(marks[marks.length - 1] !== last){
      if(last - marks[marks.length - 1] < Math.ceil(step * 0.6)) marks.pop();
      marks.push(last);
    }
    return marks;
  }

  function rgChartSVG(day, forPrint){
    const c = rgCalc(day);
    const W = 720, H = 260, P = 42;
    const series = [
      { key:'p', label:'PETRECO',  color:seriesColor('s1', forPrint) },
      { key:'r', label:'Ras Gara', color:seriesColor('s2', forPrint) }
    ];
    let maxY = 0, any = false;
    for(let i = 0; i < RG_HOURS; i++){
      ['p','r'].forEach(function(k){
        const v = day.rows[i][k];
        if(v != null){ any = true; if(v > maxY) maxY = v; }
      });
    }
    if(!any) return '<div class="rg-empty">Nothing to chart yet — enter some readings.</div>';
    maxY = maxY <= 0 ? 1 : maxY * 1.15;
    const sx = i => P + (W - 2*P) * (i / (RG_HOURS - 1));
    const sy = v => H - P - (H - 2*P) * (v / maxY);
    // Print keeps its own ink: the report is rendered into a detached window
    // (and, for the e-mailed PDF, through html2canvas) where the theme tokens
    // are not in scope, so a var() here would resolve to nothing and paint black.
    const axisCol = forPrint ? '#c7d3e0' : 'var(--border)';
    const txtCol  = forPrint ? '#41566b' : 'var(--muted)';
    // Same reason as the colours: the report document has no --font-num to
    // resolve, so an unresolved var() there quietly drops the tabular font.
    const numFont = forPrint ? "'JetBrains Mono',ui-monospace,monospace" : 'var(--font-num)';

    let grid = '';
    for(let g = 0; g <= 4; g++){
      const v = maxY * g / 4, y = sy(v);
      grid += '<line x1="' + P + '" y1="' + y.toFixed(1) + '" x2="' + (W-P) + '" y2="' + y.toFixed(1) +
              '" stroke="' + axisCol + '" stroke-width="1" stroke-dasharray="2,3"/>' +
              '<text x="' + (P-6) + '" y="' + (y+3).toFixed(1) + '" text-anchor="end" fill="' + txtCol +
              '" font-size="10" font-family="' + numFont + '">' + (Math.round(v*10)/10) + '</text>';
    }
    let xax = '';
    rgAxisMarks(RG_HOURS, 3).forEach(function(i){
      xax += '<text x="' + sx(i).toFixed(1) + '" y="' + (H-P+15) + '" text-anchor="middle" fill="' + txtCol +
             '" font-size="9" font-family="' + numFont + '">' + rgHourLabel(i) + '</text>';
    });
    let paths = '';
    series.forEach(function(s){
      let d = '', open = false, dots = '';
      for(let i = 0; i < RG_HOURS; i++){
        const v = day.rows[i][s.key];
        if(v == null){ open = false; continue; }
        const x = sx(i), y = sy(v);
        d += (open ? ' L' : ' M') + x.toFixed(1) + ' ' + y.toFixed(1);
        open = true;
        dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.6" fill="' + s.color + '"/>';
      }
      if(d) paths += '<path d="' + d.trim() + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round"/>' + dots;
    });
    const legend = series.map(function(s){
      return '<span class="rg-legend-i"><span class="sw" style="background:' + s.color + ';"></span>' + s.label + '</span>';
    }).join('');
    return '<div style="overflow-x:auto;"><svg viewBox="0 0 ' + W + ' ' + H + '" ' +
      'style="width:100%;min-width:320px;height:auto;' +
      (forPrint ? 'background:#fff;' : 'background:var(--surface);border:1px solid var(--border);border-radius:12px;') +
      'display:block;">' +
      '<text x="' + (W/2) + '" y="16" text-anchor="middle" fill="' + txtCol + '" font-size="11" font-family="' + numFont + '">Rate M³/hr</text>' +
      grid + xax + paths +
      '<line x1="' + P + '" y1="' + (H-P) + '" x2="' + (W-P) + '" y2="' + (H-P) + '" stroke="' + axisCol + '" stroke-width="1"/>' +
      '<line x1="' + P + '" y1="' + P + '" x2="' + P + '" y2="' + (H-P) + '" stroke="' + axisCol + '" stroke-width="1"/>' +
      '</svg></div>' +
      '<div class="rg-legend">' + legend + '</div>';
  }
  function rgRenderChart(){
    const el = document.getElementById('rgChart');
    if(!el) return;
    // The chart is a PETRECO-vs-Ras Gara comparison, so it is not shown to the
    // plant account at all.
    if(rgOwnSideOnly()){ el.innerHTML = ''; return; }
    el.innerHTML = '<div class="rg-sec-title"><svg class="ico" aria-hidden="true"><use href="#i-decline"/></svg> Ras Gara Test — ' + escHtml(_rgDate) + '</div>' +
                   rgChartSVG(rgGetDay(_rgDate), false);
  }

  // ── cross-day history (the workbook's HISTORY sheet) ───────────────────
  function rgHistoryRows(){
    return Object.keys(RG_DAYS).sort().map(function(d){
      const c = rgCalc(rgGetDay(d));
      return { date:d, p:c.pTotal, r:c.rTotal, diff:c.loss };
    }).filter(function(x){ return x.p != null || x.r != null; });
  }
  // ── the daily record ────────────────────────────────────────────────────
  // One row per shift day. `_rgSel` is WHICH days are on screen, and it governs
  // the chart, the table and the printed record together:
  //
  //   {k:'month'}                 the current calendar month, 1st onward
  //   {k:'month', m:'2026-06'}    a specific month, picked from the panel
  //   {k:'days',  n:90}           the last N recorded days
  //   {k:'all'}
  //   {k:'custom', from, to}      an explicit span
  //
  // Months are CALENDAR months, not rolling windows. "The last 30 days" and
  // "this month" answer different questions, and a monthly report wants the
  // second: a range that starts on the 1st can be compared with the one before
  // it, and a rolling window cannot.
  let _rgSel = { k:'month' };

  const _RG_MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const _RG_MON_FULL = ['January','February','March','April','May','June','July',
                        'August','September','October','November','December'];
  function _rgMonthOf(iso){ return String(iso).slice(0,7); }
  function _rgCurMonth(){ return rgToday().slice(0,7); }
  function _rgMonthName(m){
    const b = String(m).split('-');
    return (_RG_MON_FULL[parseInt(b[1],10)-1] || b[1]) + ' ' + b[0];
  }
  function _rgDayLabel(iso, withYear){
    const b = String(iso).split('-');
    if(b.length !== 3) return String(iso);
    return String(parseInt(b[2],10)) + ' ' + (_RG_MON[parseInt(b[1],10)-1] || b[1]) +
           (withYear ? ' ' + b[0] : '');
  }
  function _rgSpan(from, to){
    if(from === to) return _rgDayLabel(from, true);
    const sameYear = String(from).slice(0,4) === String(to).slice(0,4);
    return _rgDayLabel(from, !sameYear) + ' – ' + _rgDayLabel(to, true);
  }
  // Every month that has at least one recorded day, newest first.
  function rgMonthsPresent(){
    const seen = {};
    rgHistoryRows().forEach(function(x){ seen[_rgMonthOf(x.date)] = true; });
    return Object.keys(seen).sort().reverse();
  }

  function rgRangeRows(){
    const all = rgHistoryRows();
    if(!all.length) return all;
    const s = _rgSel;
    if(s.k === 'days')  return all.length > s.n ? all.slice(-s.n) : all;
    if(s.k === 'month'){
      const m = s.m || _rgCurMonth();
      return all.filter(function(x){ return _rgMonthOf(x.date) === m; });
    }
    if(s.k === 'custom'){
      const f = s.from || all[0].date, t = s.to || all[all.length-1].date;
      return all.filter(function(x){ return x.date >= f && x.date <= t; });
    }
    return all;   // 'all'
  }

  // Which chip is lit. Picking a specific month or a span belongs to the panel,
  // so both light "Custom" and leave it open.
  function _rgChipOn(c){
    const s = _rgSel;
    if(c === 'month')  return s.k === 'month' && !s.m;
    if(c === '90')     return s.k === 'days'  && s.n === 90;
    if(c === 'all')    return s.k === 'all';
    if(c === 'custom') return s.k === 'custom' || (s.k === 'month' && !!s.m);
    return false;
  }

  function rgRenderRange(){
    const el = document.getElementById('rgRange');
    if(!el) return;
    const total = rgHistoryRows().length;
    // Nothing recorded means nothing to range over — a lone chip beside an
    // empty table just looks broken. (`.chips:empty` drops the divider too.)
    if(!total){ el.innerHTML = ''; rgRenderCustom(); return; }
    // The chips are a CHOICE, so they carry no counts — "All 3" reads as though
    // the 3 were part of what you are picking. How many days there are, and how
    // many are on screen, is the header's job.
    const opts = [['month','This month'], ['90','90 days'], ['all','All'], ['custom','Custom']];
    el.innerHTML = opts.map(function(o){
      // A window wider than the whole record is noise — except "All", which
      // always makes sense, and "Custom", which is a door rather than a window.
      if(o[0] === '90' && total <= 90) return '';
      return '<button data-rgsel="' + o[0] + '"' + (_rgChipOn(o[0]) ? ' class="on"' : '') +
             '>' + escHtml(o[1]) + '</button>';
    }).join('');
    rgRenderCustom();
  }

  // ── the custom-range panel ──────────────────────────────────────────────
  // Two ways in, because they are different questions: "show me June" is one
  // click, and "show me the 12th to the 20th" needs two dates.
  function rgRenderCustom(){
    const el = document.getElementById('rgCustom');
    if(!el) return;
    const open = _rgChipOn('custom');
    el.style.display = open ? 'block' : 'none';
    if(!open){ el.innerHTML = ''; return; }
    const all = rgHistoryRows();
    if(!all.length){ el.innerHTML = ''; return; }
    const lo = all[0].date, hi = all[all.length-1].date;
    const s = _rgSel;
    const from = s.k === 'custom' ? (s.from || lo) : '';
    const to   = s.k === 'custom' ? (s.to   || hi) : '';
    const months = rgMonthsPresent();
    el.innerHTML =
      '<div class="fld"><label for="rgCustMonth">Whole month</label>' +
        '<select id="rgCustMonth">' +
          '<option value="">Choose a month…</option>' +
          months.map(function(m){
            return '<option value="' + escAttr(m) + '"' +
                   (s.k === 'month' && s.m === m ? ' selected' : '') + '>' +
                   escHtml(_rgMonthName(m)) + '</option>'; }).join('') +
        '</select></div>' +
      '<div class="or">or a specific span</div>' +
      '<div class="pair">' +
        '<div class="fld"><label for="rgCustFrom">From</label>' +
          '<input type="date" id="rgCustFrom" min="' + escAttr(lo) + '" max="' + escAttr(hi) +
          '" value="' + escAttr(from) + '"></div>' +
        '<div class="fld"><label for="rgCustTo">To</label>' +
          '<input type="date" id="rgCustTo" min="' + escAttr(lo) + '" max="' + escAttr(hi) +
          '" value="' + escAttr(to) + '"></div>' +
      '</div>';

    const mSel = document.getElementById('rgCustMonth');
    if(mSel) mSel.addEventListener('change', function(){
      if(!this.value) return;
      _rgSel = { k:'month', m:this.value };
      rgRenderRange(); rgRenderRecHead(); rgRenderHistChart(); rgRenderHistory();
    });
    const f = document.getElementById('rgCustFrom'), t = document.getElementById('rgCustTo');
    function applySpan(edited){
      let a = f.value || lo, b = t.value || hi;
      // Entered backwards is a slip, not an empty result. Move the END the
      // operator did NOT just touch — rewriting the date they are still looking
      // at is the confusing way to fix this.
      if(a > b){
        if(edited === 'from'){ b = a; t.value = b; }
        else                 { a = b; f.value = a; }
      }
      _rgSel = { k:'custom', from:a, to:b };
      rgRenderRange(); rgRenderRecHead(); rgRenderHistChart(); rgRenderHistory();
    }
    if(f) f.addEventListener('change', function(){ applySpan('from'); });
    if(t) t.addEventListener('change', function(){ applySpan('to'); });
  }

  // ── the daily-record header ─────────────────────────────────────────────
  function rgRenderRecHead(){
    const el = document.getElementById('rgHistSub');
    if(!el) return;
    const total = rgHistoryRows().length;
    if(!total){ el.textContent = 'No shift days recorded yet'; return; }
    const rows = rgRangeRows();
    const s = _rgSel;
    const span = rows.length ? escHtml(_rgSpan(rows[0].date, rows[rows.length-1].date)) : '';
    const days = '<b>' + rows.length + '</b> day' + (rows.length === 1 ? '' : 's');
    let txt;
    if(s.k === 'month'){
      const name = escHtml(_rgMonthName(s.m || _rgCurMonth()));
      txt = rows.length ? '<b>' + name + '</b> &nbsp;·&nbsp; ' + days + ' &nbsp;·&nbsp; ' + span
                        : '<b>' + name + '</b> &nbsp;·&nbsp; nothing recorded in this month';
    } else if(s.k === 'custom'){
      txt = rows.length ? days + ' &nbsp;·&nbsp; ' + span
                        : 'No recorded days in that range';
    } else if(s.k === 'days'){
      txt = 'Showing <b>' + rows.length + '</b> of ' + total + ' days &nbsp;·&nbsp; ' + span;
    } else {
      txt = 'All <b>' + total + '</b> recorded day' + (total === 1 ? '' : 's') +
            ' &nbsp;·&nbsp; ' + span;
    }
    el.innerHTML = txt;
  }

  // Day-by-day trend. Same shape as the hourly chart but one point per day, and
  // it shows only the series the signed-in role is allowed to see.
  function rgHistChartSVG(rows, forPrint){
    const side = forPrint ? 'both' : rgSide();
    const series = [];
    if(side === 'both' || side === 'petreco')
      series.push({ key:'p', label:'PETRECO',  color:seriesColor('s1', forPrint) });
    if(side === 'both' || side === 'rasgara')
      series.push({ key:'r', label:'Ras Gara', color:seriesColor('s2', forPrint) });
    if(rows.length < 2) return '';
    const W = 760, H = 240, P = 44;
    let maxY = 0, any = false;
    rows.forEach(function(x){ series.forEach(function(sr){
      const v = x[sr.key]; if(v != null){ any = true; if(v > maxY) maxY = v; } }); });
    if(!any) return '';
    maxY = maxY <= 0 ? 1 : maxY * 1.15;
    const sx = i => P + (W - 2*P) * (rows.length === 1 ? 0.5 : i / (rows.length - 1));
    const sy = v => H - P - (H - 2*P) * (v / maxY);
    const axisCol = forPrint ? '#c7d3e0' : 'var(--border)';
    const txtCol  = forPrint ? '#41566b' : 'var(--muted)';
    const numFont = forPrint ? "'JetBrains Mono',ui-monospace,monospace" : 'var(--font-num)';
    let grid = '';
    for(let g = 0; g <= 4; g++){
      const v = maxY * g / 4, y = sy(v);
      grid += '<line x1="' + P + '" y1="' + y.toFixed(1) + '" x2="' + (W-P) + '" y2="' + y.toFixed(1) +
        '" stroke="' + axisCol + '" stroke-width="1" stroke-dasharray="2,3"/>' +
        '<text x="' + (P-6) + '" y="' + (y+3).toFixed(1) + '" text-anchor="end" fill="' + txtCol +
        '" font-size="10" font-family="' + numFont + '">' + Math.round(v) + '</text>';
    }
    // At most ~7 date labels, or they collide once the range is long. The last
    // day is always one of them — an axis that stops before the most recent
    // reading is the thing people notice first.
    let xax = '';
    rgAxisMarks(rows.length, Math.max(1, Math.ceil(rows.length / 7))).forEach(function(i){
      xax += '<text x="' + sx(i).toFixed(1) + '" y="' + (H-P+15) + '" text-anchor="middle" fill="' + txtCol +
        '" font-size="9" font-family="' + numFont + '">' + escHtml(rows[i].date.slice(5)) + '</text>';
    });
    let paths = '';
    series.forEach(function(sr){
      let d = '', open = false, dots = '';
      rows.forEach(function(x, i){
        const v = x[sr.key];
        if(v == null){ open = false; return; }
        const px = sx(i), py = sy(v);
        d += (open ? ' L' : ' M') + px.toFixed(1) + ' ' + py.toFixed(1);
        open = true;
        if(rows.length <= 45)
          dots += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="2.4" fill="' + sr.color + '"/>';
      });
      if(d) paths += '<path d="' + d.trim() + '" fill="none" stroke="' + sr.color +
        '" stroke-width="2" stroke-linejoin="round"/>' + dots;
    });
    const legend = series.map(function(sr){
      return '<span class="rg-legend-i"><span class="sw" style="background:' + sr.color + ';"></span>' +
             escHtml(sr.label) + '</span>'; }).join('');
    return '<div style="overflow-x:auto;"><svg viewBox="0 0 ' + W + ' ' + H + '" ' +
      'style="width:100%;min-width:320px;height:auto;' +
      (forPrint ? 'background:#fff;' : 'background:var(--surface);border:1px solid var(--border);border-radius:12px;') +
      'display:block;">' +
      '<text x="' + (W/2) + '" y="16" text-anchor="middle" fill="' + txtCol +
      '" font-size="11" font-family="' + numFont + '">Daily total M³/d</text>' +
      grid + xax + paths +
      '<line x1="' + P + '" y1="' + (H-P) + '" x2="' + (W-P) + '" y2="' + (H-P) + '" stroke="' + axisCol + '" stroke-width="1"/>' +
      '<line x1="' + P + '" y1="' + P + '" x2="' + P + '" y2="' + (H-P) + '" stroke="' + axisCol + '" stroke-width="1"/>' +
      '</svg></div><div class="rg-legend">' + legend + '</div>';
  }

  function rgRenderHistChart(){
    const el = document.getElementById('rgHistChart');
    if(!el) return;
    el.innerHTML = rgHistChartSVG(rgRangeRows(), false);
  }

  function rgRenderHistory(){
    const el = document.getElementById('rgHistory');
    if(!el) return;
    const rows = rgRangeRows();
    if(!rows.length){ el.innerHTML = '<div class="rg-empty">No days recorded yet.</div>'; return; }
    const side = rgSide();
    let body = '';
    rows.slice().reverse().forEach(function(x){
      if(side !== 'both'){
        body += '<tr data-rgday="' + escAttr(x.date) + '" style="cursor:pointer">' +
          '<td class="rg-time">' + escHtml(x.date) + '</td>' +
          '<td>' + rgFmt(side === 'petreco' ? x.p : x.r, 1) + '</td></tr>';
        return;
      }
      const cls = x.diff == null ? '' : (rgDiffIsBad(x.diff)
        ? 'style="color:var(--red,#f87171)"' : 'style="color:var(--green,#4ade80)"');
      body += '<tr data-rgday="' + escAttr(x.date) + '" style="cursor:pointer">' +
        '<td class="rg-time">' + escHtml(x.date) + '</td>' +
        '<td>' + rgFmt(x.p,1) + '</td><td>' + rgFmt(x.r,1) + '</td>' +
        '<td ' + cls + '>' + rgFmt(x.diff,1) + '</td></tr>';
    });
    const head = side !== 'both'
      ? '<tr><th>Date</th><th>' + (side === 'petreco' ? 'PETRECO' : 'Ras Gara') + ' total m³/d</th></tr>'
      : '<tr><th>Date</th><th>PETRECO</th><th>R/G</th><th>Difference</th></tr>';
    el.innerHTML = '<div class="rg-tbl-wrap"><table class="rg-tbl">' +
      '<thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
  }

  function rgRenderAll(){
    if(!_rgDate) _rgDate = rgToday();
    // Flag the body so CSS can size the own-side table for three columns
    // instead of five — the 520px minimum was pushing the plant account's
    // Cumulative column off a phone screen.
    document.body.classList.toggle('rg-own-side', rgOwnSideOnly());
    const inp = document.getElementById('rgDate');
    if(inp && inp.value !== _rgDate) inp.value = _rgDate;
    // An operator never sees a comparison, so the heading must not promise one.
    // Print and e-mail produce the comparison report, so they are not offered
    // to either operator group either.
    const side = rgSide();
    const COPY = {
      both:    { title:' Production Comparison',
                 sub:'Hourly PETRECO vs Ras Gara readings, losses & daily trend',
                 hist:'Daily record' },
      petreco: { title:' PETRECO — Daily Readings',
                 sub:'Enter the hourly PETRECO test-separator readings for each shift',
                 hist:'Your daily record' },
      rasgara: { title:' Ras Gara — Daily Readings',
                 sub:'Enter the hourly Ras Gara plant readings for each shift',
                 hist:'Your daily record' }
    }[side];
    // lastChild, not textContent: the heading holds an SVG icon as its first
    // child and textContent would delete it.
    const hd = document.getElementById('rgHeading');
    if(hd) hd.lastChild.textContent = COPY.title;
    const sub = document.getElementById('rgSubtitle');
    if(sub) sub.textContent = COPY.sub;
    const acts = document.querySelector('#page-rasgara .rg-actions');
    if(acts) acts.style.display = (side === 'both') ? '' : 'none';
    // The daily-record report is the PETRECO-vs-Ras-Gara comparison across
    // days, so like the day report it is not offered to an operator.
    const histActs = document.getElementById('rgHistActions');
    // Admin only, and only once there is something to print.
    if(histActs) histActs.style.display =
      (side === 'both' && rgHistoryRows().length) ? '' : 'none';
    const histTitle = document.getElementById('rgHistHeading');
    if(histTitle) histTitle.textContent = COPY.hist;
    rgRenderTable(); rgRenderTotals(); rgRenderChart();
    rgRenderRange(); rgRenderRecHead();
    rgRenderHistChart(); rgRenderHistory();
    const sv = document.getElementById('rgSaved');
    const day = rgGetDay(_rgDate);
    if(sv) sv.textContent = day.updatedAt
      ? 'last saved ' + new Date(day.updatedAt).toLocaleString('en-GB') + (day.updatedBy ? ' by ' + day.updatedBy : '')
      : '';
  }
  window.refreshRasGaraPage = rgRenderAll;

  // ── editing & persistence ───────────────────────────────────────────────
  function rgApplyInput(kind, i, raw){
    const day = RG_DAYS[_rgDate] || rgBlankDay(_rgDate);
    if(!day.rows) day.rows = rgBlankDay(_rgDate).rows;
    while(day.rows.length < RG_HOURS) day.rows.push({ p:null, r:null, rc:null });
    // Guard here as well as in the UI: a disabled input is not security.
    if(kind === 'p' && !rgCanEditPetreco()) return false;
    if((kind === 'r' || kind === 'rc') && !rgCanEditRasGara()) return false;
    day.rows[i][kind] = rgNum(raw);
    day.date = _rgDate;
    day.startHour = RG_START_HOUR;
    RG_DAYS[_rgDate] = day;
    return true;
  }
  function rgSaveLocal(){
    try { lsSet(RG_LS, JSON.stringify(RG_DAYS)); checkStorageHeadroom(); } catch(e){}
  }
  function rgQueueSave(){
    rgSaveLocal();
    if(_rgSaveTimer) clearTimeout(_rgSaveTimer);
    // Debounced: an operator typing 24 rows should produce one write, not 24.
    _rgSaveTimer = setTimeout(function(){ _rgSaveTimer = null; rgPushToCloud(); }, 1200);
  }
  async function rgPushToCloud(){
    if(rgReadOnly()) return;
    if(typeof db === 'undefined' || typeof FIREBASE_OK === 'undefined' || !FIREBASE_OK) return;
    const day = RG_DAYS[_rgDate];
    if(!day) return;
    const who = (typeof currentUser !== 'undefined' && currentUser) ? currentUser.name : 'user';
    try {
      _rgSkipNext = true;
      // Write ONLY the fields this role owns, merged into whatever is already
      // there.
      //
      // The previous version sent the entire day from this device's local copy.
      // With one operator group that was survivable; with two it is data loss:
      // the PETRECO operator saves at 14:10 carrying a copy of the Ras Gara
      // column from 13:00, and Ras Gara's 14:00 entry is silently gone. Worst
      // offline, where a phone can queue a write for hours before replaying it
      // — which is exactly the case this app is built for.
      //
      // merge:true deep-merges maps, so `{rows:{"7":{p:5}}}` leaves
      // rows["7"].r and .rc untouched, and the merge happens server-side at
      // replay time rather than against a stale local snapshot.
      // One exception to "own fields only": a day still stored in the old array
      // shape has to be rewritten whole, because merging a map into an array
      // replaces it rather than merging. Sending both sides once converts the
      // document; every later save is a proper partial patch. The local copy is
      // authoritative for that single write because the listener has just
      // synced it.
      const upgrade = !!(RG_DAYS[_rgDate] && RG_DAYS[_rgDate]._legacyRows);
      const edP = rgCanEditPetreco() || upgrade;
      const edR = rgCanEditRasGara() || upgrade;
      const rowsPatch = {};
      for(let i = 0; i < RG_HOURS; i++){
        const src = day.rows[i] || {};
        const cell = {};
        if(edP) cell.p = src.p == null ? null : src.p;
        if(edR){ cell.r  = src.r  == null ? null : src.r;
                 cell.rc = src.rc == null ? null : src.rc; }
        rowsPatch[String(i)] = cell;
      }
      if(upgrade) RG_DAYS[_rgDate]._legacyRows = false;
      await db.collection(RG_COL).doc(_rgDate).set({
        date:_rgDate, startHour:RG_START_HOUR, rows:rowsPatch,
        updatedBy:who, updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      }, { merge:true });
      const dates = Object.keys(RG_DAYS).sort();
      await db.collection(RG_META.col).doc(RG_META.doc).set({
        dates:dates, count:dates.length,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp(), updatedBy:who
      });
      day.updatedAt = Date.now(); day.updatedBy = who;
      rgSaveLocal();
      const sv = document.getElementById('rgSaved');
      if(sv) sv.textContent = 'saved ' + new Date().toLocaleTimeString('en-GB');
      if(typeof updateCloudStatus === 'function') updateCloudStatus('synced','Saved to cloud');
    } catch(err){
      console.error('[RasGara] save failed', err);
      showToast('Could not save to cloud: ' + (err.code || err.message), true);
      rgCloudError(err);
    }
  }

  // ── cloud sync (same cache-version pattern as the other datasets) ──────
  // The footer line is the ONLY thing telling anyone whether this app is
  // talking to Firestore, so every outcome has to reach it — including the
  // healthy ones. It used to be written in exactly one place, after a
  // successful save, which meant a correctly-connected app sat on
  // "Connecting…" until somebody typed a reading, and a rules failure looked
  // identical to a slow network. If you add a path through here, give it a
  // status.
  function rgCloud(status, text){
    if(typeof updateCloudStatus === 'function') updateCloudStatus(status, text);
  }
  function rgCloudIdle(){
    const n = Object.keys(RG_DAYS).length;
    if(!navigator.onLine){ rgCloud('offline', 'Offline — showing ' + n + ' saved day(s)'); return; }
    rgCloud('synced', n ? 'Cloud connected · ' + n + ' day(s)' : 'Cloud connected · no readings yet');
  }
  function rgCloudError(err){
    const code = (err && (err.code || err.message)) || 'unknown';
    // permission-denied is the one that actually happens, and it has exactly
    // one cause worth naming: firestore.rules was never published.
    rgCloud('error', code === 'permission-denied'
      ? 'Cloud refused access — publish firestore.rules'
      : 'Cloud error: ' + code);
    console.error('[Firestore]', err);
  }
  function rgStartListener(){
    rgStopListener();
    if(typeof db === 'undefined' || typeof FIREBASE_OK === 'undefined' || !FIREBASE_OK){
      rgCloud('error', (typeof window.__BOOT_ERROR__ === 'string' && window.__BOOT_ERROR__)
        ? 'No cloud: ' + window.__BOOT_ERROR__ : 'No cloud connection');
      return;
    }
    rgCloud('syncing', 'Connecting…');
    _rgMetaUnsub = db.collection(RG_META.col).doc(RG_META.doc).onSnapshot(async function(doc){
      if(doc.metadata && doc.metadata.hasPendingWrites && !(doc.data() && doc.data().updatedAt)) return;
      // No meta document is the NORMAL state of a brand-new project, not a
      // failure — the connection is fine, there is simply nothing in it yet.
      // Saying so is what tells you the difference between "empty" and "broken".
      if(!doc.exists){ _rgFirstSnap = false; rgCloudIdle(); rgRenderAll(); return; }
      const data = doc.data() || {};
      const ts = data.updatedAt ? data.updatedAt.toMillis() : 0;
      const isFirst = _rgFirstSnap; _rgFirstSnap = false;
      if(!isFirst && ts === _rgLastTs) return;
      _rgLastTs = ts;
      if(_rgSkipNext){ _rgSkipNext = false; setSyncedVersion(RG_VERK, ts); rgCloudIdle(); return; }
      if(isCacheCurrent(RG_VERK, ts, Object.keys(RG_DAYS).length > 0)){
        console.log('[Firestore] Ras Gara already current (v' + ts + ') — skipped collection read');
        rgRenderAll(); rgCloudIdle(); return;
      }
      rgCloud('syncing', 'Loading readings…');
      try {
        const snap = await db.collection(RG_COL).get();
        const obj = {};
        snap.forEach(function(d){
          const dd = d.data() || {};
          obj[dd.date || d.id] = {
            date:dd.date || d.id, startHour:dd.startHour || RG_START_HOUR, rows:rgRowsToArray(dd.rows),
            // A day still stored as an array pre-dates the merge-write change.
            // Merging a map into an array REPLACES it, so a partial patch would
            // drop the other side. Flagged here; rgPushToCloud sends the whole
            // day once to convert the shape, then patches normally after that.
            _legacyRows: Array.isArray(dd.rows),
            updatedBy:dd.updatedBy || '',
            updatedAt:(dd.updatedAt && dd.updatedAt.toMillis) ? dd.updatedAt.toMillis() : 0
          };
        });
        RG_DAYS = obj;
        rgSaveLocal();
        setSyncedVersion(RG_VERK, ts);
        rgRenderAll();
        rgCloudIdle();
        if(!isFirst) showToast('Readings synced from cloud');
      } catch(err){ rgCloudError(err); }
    }, function(err){ rgCloudError(err); });
  }
  function rgStopListener(){
    if(_rgMetaUnsub){ _rgMetaUnsub(); _rgMetaUnsub = null; }
    _rgFirstSnap = true; _rgLastTs = 0;
  }
  window.startRasGaraListener = rgStartListener;
  window.stopRasGaraListener  = rgStopListener;

  // Losing the network does not fire the listener's error callback — Firestore
  // just goes quiet and keeps serving its local cache, which is the behaviour
  // we want but leaves the footer claiming a live connection. These two events
  // are what make the line honest offline.
  window.addEventListener('offline', function(){ if(currentUser) rgCloudIdle(); });
  window.addEventListener('online',  function(){ if(currentUser) rgCloudIdle(); });

  // ── wiring ──────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function(){
    const dateEl = document.getElementById('rgDate');
    if(dateEl){
      dateEl.value = rgToday();
      dateEl.addEventListener('change', function(){
        _rgDate = this.value || rgToday();
        rgRenderAll();
      });
    }
    const todayBtn = document.getElementById('rgTodayBtn');
    if(todayBtn) todayBtn.addEventListener('click', function(){ _rgDate = rgToday(); rgRenderAll(); });

    const area = document.getElementById('rgTableArea');
    if(area){
      // Delegated so the handlers survive every re-render.
      area.addEventListener('input', function(e){
        const t = e.target;
        if(!t || !t.classList.contains('rg-in')) return;
        const kind = t.getAttribute('data-rg'), i = parseInt(t.getAttribute('data-i'), 10);
        if(!kind || isNaN(i)) return;
        if(!rgApplyInput(kind, i, t.value)) return;
        t.classList.add('rg-dirty');
        // Only the derived cells and totals need repainting — never the input
        // the operator is typing into, or the caret would jump.
        rgRefreshDerived();
        rgQueueSave();
      });
      area.addEventListener('blur', function(e){
        if(e.target && e.target.classList.contains('rg-in')) e.target.classList.remove('rg-dirty');
      }, true);
    }
    const hist = document.getElementById('rgHistory');
    if(hist) hist.addEventListener('click', function(e){
      const tr = e.target.closest('tr[data-rgday]');
      if(!tr) return;
      _rgDate = tr.getAttribute('data-rgday');
      rgRenderAll();
      document.getElementById('page-rasgara').scrollIntoView({behavior:'smooth', block:'start'});
    });
    // Every one of these is async or can throw, and a rejected promise from a
    // click handler is COMPLETELY silent — no toast, no console entry the
    // operator would ever see. That is how "Send by e-mail" spent a release
    // doing nothing at all: it threw on a missing helper after the PDF was
    // built and the failure went nowhere. Route them all through one wrapper
    // so a button can never again look dead.
    function _bind(id, fn, label){
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('click', function(){
        try {
          const r = fn();
          if(r && typeof r.catch === 'function') r.catch(function(err){
            console.error('[RasGara] ' + label + ' failed', err);
            showToast(label + ' failed: ' + ((err && (err.message || err.code)) || 'unknown'), true);
          });
        } catch(err){
          console.error('[RasGara] ' + label + ' failed', err);
          showToast(label + ' failed: ' + ((err && (err.message || err.code)) || 'unknown'), true);
        }
      });
    }
    _bind('rgPrintBtn',     rgPrintReport,  'Print');
    _bind('rgMailBtn',      rgEmailReport,  'Send by e-mail');
    _bind('rgHistPrintBtn', rgPrintHistory, 'Print daily record');
    // Delegated: the range chips are re-rendered on every pass, so binding each
    // button directly would leak listeners.
    const rangeEl = document.getElementById('rgRange');
    if(rangeEl) rangeEl.addEventListener('click', function(e){
      const b = e.target.closest('button[data-rgsel]');
      if(!b) return;
      const k = b.getAttribute('data-rgsel');
      // "Custom" opens the panel without changing what is shown yet — the
      // selection only moves once a month or a date is actually picked.
      if(k === 'custom'){ if(!_rgChipOn('custom')) _rgSel = { k:'custom' }; }
      else if(k === 'month') _rgSel = { k:'month' };
      else if(k === 'all')   _rgSel = { k:'all' };
      else                   _rgSel = { k:'days', n:parseInt(k,10) };
      rgRenderRange(); rgRenderRecHead(); rgRenderHistChart(); rgRenderHistory();
    });
  });

  // Repaint the calculated cells + totals + chart without touching inputs.
  function rgRefreshDerived(){
    const day = rgGetDay(_rgDate), c = rgCalc(day);
    if(!rgOwnSideOnly()){
      const rows = document.querySelectorAll('#rgTableArea tbody tr');
      for(let i = 0; i < rows.length; i++){
        const cell = rows[i].children[2];   // PETRECO cumulative column
        if(cell) cell.textContent = rgFmt(c.pCum[i], 1);
      }
    }
    rgRenderTotals(); rgRenderChart();
  }

  // ── written summary ─────────────────────────────────────────────────────
  // The number alone does not tell an operator whether the shift was normal.
  // Compare against the recent average so the report says something useful.
  function rgSummaryText(day){
    const c = rgCalc(day);
    if(c.pTotal == null && c.rTotal == null) return 'No readings were recorded for this shift.';
    const parts = [];
    parts.push('Over the 24-hour shift beginning ' + rgHourLabel(0) + ' on ' + day.date +
               ', PETRECO metered ' + rgFmt(c.pTotal,1) + ' m³ (' + rgFmt(c.pBbl,0) + ' bbl) and Ras Gara metered ' +
               rgFmt(c.rTotal,1) + ' m³ (' + rgFmt(c.rBbl,0) + ' bbl).');
    if(c.loss != null){
      const dir = c.loss > 0 ? 'less than PETRECO' : 'more than PETRECO';
      parts.push('Ras Gara produced ' + rgFmt(Math.abs(c.loss),1) + ' m³ (' + rgFmt(Math.abs(c.lossBbl),0) + ' bbl) ' + dir +
                 (c.lossPct == null ? '' : ', a difference of ' + rgFmt(Math.abs(c.lossPct),1) + '% of the PETRECO figure') + '.');
    }
    // Context from the previous recorded days.
    const hist = rgHistoryRows().filter(function(x){ return x.date < day.date && x.diff != null; });
    const recent = hist.slice(-7);
    if(recent.length >= 2){
      const avg = recent.reduce(function(a,x){ return a + x.diff; }, 0) / recent.length;

      parts.push('The average difference over the previous ' + recent.length + ' recorded day(s) is ' +
                 rgFmt(avg,1) + ' m³/d.' +
                 (delta == null ? '' :
                   Math.abs(delta) < 1
                     ? ' This shift is in line with that average.'
                     : ' This shift is ' + rgFmt(Math.abs(delta),1) + ' m³/d ' +
                       (delta > 0 ? 'worse' : 'better') + ' than that average.'));
    }
    const missP = day.rows.filter(function(r){ return r.p == null; }).length;
    const missR = day.rows.filter(function(r){ return r.r == null; }).length;
    if(missP || missR){
      parts.push('Note: ' + (missP ? missP + ' PETRECO ' : '') + (missP && missR ? 'and ' : '') +
                 (missR ? missR + ' Ras Gara ' : '') + 'hourly reading(s) were not entered, so the totals cover only the hours recorded.');
    }
    return parts.join(' ');
  }

  // ── PDF: a single-page document wrapping a rendered image of the report ─
  // Hand-built rather than pulling in a 365 KB PDF library for one button.
  function rgBuildPdf(jpegDataUrl, pxW, pxH){
    const b64 = jpegDataUrl.split(',')[1];
    const bin = atob(b64);
    // A4 portrait at 72 dpi, with a small margin; scale the image to fit.
    const PW = 595.28, PH = 841.89, M = 24;
    const availW = PW - 2*M, availH = PH - 2*M;
    const scale = Math.min(availW / pxW, availH / pxH);
    const w = pxW * scale, h = pxH * scale;
    const x = (PW - w) / 2, y = PH - M - h;
    const objs = [];
    objs[1] = '<</Type/Catalog/Pages 2 0 R>>';
    objs[2] = '<</Type/Pages/Kids[3 0 R]/Count 1>>';
    objs[3] = '<</Type/Page/Parent 2 0 R/MediaBox[0 0 ' + PW.toFixed(2) + ' ' + PH.toFixed(2) +
              ']/Resources<</XObject<</I0 4 0 R>>/ProcSet[/PDF/ImageC]>>/Contents 5 0 R>>';
    const stream = 'q ' + w.toFixed(2) + ' 0 0 ' + h.toFixed(2) + ' ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' cm /I0 Do Q';
    // Build as latin1 so every byte offset below is exact.
    let pdf = '%PDF-1.4\n';
    const offsets = [];
    function add(num, dict, streamData){
      offsets[num] = pdf.length;
      pdf += num + ' 0 obj\n' + dict + '\n';
      if(streamData != null) pdf += 'stream\n' + streamData + '\nendstream\n';
      pdf += 'endobj\n';
    }
    add(1, objs[1]); add(2, objs[2]); add(3, objs[3]);
    add(4, '<</Type/XObject/Subtype/Image/Width ' + pxW + '/Height ' + pxH +
           '/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ' + bin.length + '>>', bin);
    add(5, '<</Length ' + stream.length + '>>', stream);
    const xref = pdf.length;
    pdf += 'xref\n0 6\n0000000000 65535 f \n';
    for(let i = 1; i <= 5; i++) pdf += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
    pdf += 'trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n' + xref + '\n%%EOF';
    const bytes = new Uint8Array(pdf.length);
    for(let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xff;
    return new Blob([bytes], { type:'application/pdf' });
  }

  async function rgMakePdfBlob(){
    const day = rgGetDay(_rgDate);
    // Render the report off-screen at 2x for a crisp page.
    const host = document.createElement('iframe');
    host.style.cssText = 'position:fixed;left:-10000px;top:0;width:820px;height:1200px;border:0;';
    document.body.appendChild(host);
    try {
      const doc = host.contentDocument;
      doc.open(); doc.write(rgReportHTML(day)); doc.close();
      await new Promise(function(res){ setTimeout(res, 350); });
      const target = doc.body;
      const canvas = await html2canvas(target, { scale:2, backgroundColor:'#ffffff',
        width:820, windowWidth:820, height:target.scrollHeight, windowHeight:target.scrollHeight });
      const jpeg = canvas.toDataURL('image/jpeg', 0.92);
      return rgBuildPdf(jpeg, canvas.width, canvas.height);
    } finally { host.remove(); }
  }

  // ── handing the finished PDF to the user ────────────────────────────────
  // This is a sheet with buttons rather than something automatic, and that is
  // deliberate. Building the PDF takes seconds, and BOTH ways of delivering it
  // need a live user gesture:
  //
  //   · navigator.share() throws NotAllowedError without transient activation;
  //   · window.open() is blocked as a pop-up for the same reason.
  //
  // The tap that started the build is long spent by the time the blob exists,
  // so anything fired from here is refused — silently, on a phone. Putting the
  // delivery behind a fresh tap is what makes it work at all. It also lets
  // whoever is holding the phone choose share, save or Gmail, which the old
  // automatic path decided for them.
  function rgOfferPdf(blob, fname, subject, body){
    const sheet = document.getElementById('pdfSheet');
    const row   = document.getElementById('pdfSheetRow');
    const nameEl= document.getElementById('pdfSheetName');
    if(!sheet || !row){ _downloadBlob(blob, fname); return; }   // markup missing: still deliver
    nameEl.textContent = fname;
    const file = new File([blob], fname, { type:'application/pdf' });
    const canShare = !!(navigator.canShare && navigator.share && navigator.canShare({ files:[file] }));
    const close = function(){ sheet.classList.remove('show'); row.innerHTML = ''; };

    const btns = [];
    if(canShare) btns.push(['i-mail', 'Share / e-mail', 'primary', async function(){
      try { await navigator.share({ files:[file], title:subject, text:body }); close(); }
      catch(err){
        if(err && err.name === 'AbortError') return;            // backed out; leave the sheet up
        console.warn('[RasGara] share failed', err);
        showToast('Sharing was refused — use Save PDF instead', true);
      }
    }]);
    btns.push(['i-print', 'Save PDF', canShare ? '' : 'primary', function(){
      _downloadBlob(blob, fname);
      showToast('PDF saved to your downloads');
      close();
    }]);
    btns.push(['i-mail', 'Open Gmail', '', function(){
      // Inside the click, so it is a user-initiated navigation and not a pop-up.
      window.open('https://mail.google.com/mail/?view=cm&fs=1&su=' +
        encodeURIComponent(subject) + '&body=' + encodeURIComponent(body), '_blank', 'noopener');
      showToast('Attach the saved PDF to the draft');
    }]);
    btns.push(['', 'Cancel', '', close]);

    row.innerHTML = '';
    btns.forEach(function(b){
      const el = document.createElement('button');
      el.className = 'rg-btn' + (b[2] === 'primary' ? ' rg-btn-primary' : '');
      el.innerHTML = (b[0] ? '<svg class="ico" aria-hidden="true"><use href="#' + b[0] + '"/></svg> ' : '') +
                     escHtml(b[1]);
      el.addEventListener('click', b[3]);
      row.appendChild(el);
    });
    sheet.classList.add('show');
    sheet.onclick = function(e){ if(e.target === sheet) close(); };
  }

  async function rgEmailReport(){
    const day = rgGetDay(_rgDate);
    const fname = 'Ras_Gara_Comparison_' + day.date + '.pdf';
    const subject = 'Sinai Field production comparison — ' + day.date;
    const body = rgSummaryText(day) + '\n\n(The full table and chart are in the attached PDF.)';
    showToast('Building PDF…');
    let blob;
    try { blob = await rgMakePdfBlob(); }
    catch(err){
      console.error('[RasGara] PDF failed', err);
      showToast('Could not build the PDF: ' + ((err && err.message) || 'unknown'), true);
      return;
    }
    if(!blob || !blob.size){ showToast('The PDF came out empty — nothing to send', true); return; }
    rgOfferPdf(blob, fname, subject, body);
  }



  window.__RG = { get days(){ return RG_DAYS; }, getDay:rgGetDay, calc:rgCalc,
                  hourLabel:rgHourLabel, get date(){ return _rgDate; },
                  COL:RG_COL, META:RG_META, LS:RG_LS, VERK:RG_VERK,
                  START:RG_START_HOUR, HOURS:RG_HOURS, BBL:M3_TO_BBL,
                  fmt:rgFmt, num:rgNum, rowDate:rgRowDate, today:rgToday,
                  chartSVG:rgChartSVG, reportHTML:rgReportHTML, makePdfBlob:rgMakePdfBlob,
                  rangeRows:rgRangeRows, histReportHTML:rgHistReportHTML,
                  setDate:function(d){ _rgDate = d; rgRenderAll(); } };
})();
</script>

<script>

//  DAY / NIGHT THEME
// ══════════════════════════════════════════════════════════════════════
(function(){
  const KEY = 'rasgara_theme';
  function applyTheme(mode, persist){
    const light = (mode === 'light');
    document.body.classList.toggle('light-mode', light);
    const btn = document.getElementById('themeToggleBtn');
    // innerHTML, not textContent: the button holds an SVG <use>, and assigning
    // text would delete the sprite reference and leave it blank.
    if(btn) btn.innerHTML = '<svg class="ico ico-lg" aria-hidden="true"><use href="#i-' +
                            (light ? 'sun' : 'moon') + '"/></svg>';
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', light ? '#0b3d68' : '#0a1420');
    if(persist){ try{ localStorage.setItem(KEY, mode); }catch(e){} }
    // The chart hard-codes nothing, but it is already drawn — repaint it so the
    // series colours pick up the new tokens immediately rather than at next render.
    if(typeof window.refreshRasGaraPage === 'function') window.refreshRasGaraPage();
  }
  window.toggleTheme = function(){
    applyTheme(document.body.classList.contains('light-mode') ? 'dark' : 'light', true);
  };
  let saved; try{ saved = localStorage.getItem(KEY); }catch(e){}
  applyTheme((saved === 'light' || saved === 'dark') ? saved : 'light', false);
})();

// ══════════════════════════════════════════════════════════════════════
//  SERVICE WORKER
// ══════════════════════════════════════════════════════════════════════
// Registered with an explicit './' scope. This app is on its own origin, but
// the scope is stated anyway so that moving it into a subfolder later cannot
// let it claim pages that are not its own.
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js', { scope:'./' }).then(function(reg){
      reg.addEventListener('updatefound', function(){
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          // A waiting worker with a controller already present means this is an
          // update, not a first install — only then is the banner meaningful.
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            const b = document.getElementById('swUpdateBanner');
            if(b){
              b.style.display = 'block';
              b.onclick = function(){ nw.postMessage({ type:'SKIP_WAITING' }); };
            }
          }
        });
      });
    }).catch(function(e){ console.warn('[sw]', e); });

    let _reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(_reloaded) return;   // guard against the reload loop
      _reloaded = true;
      window.location.reload();
    });
  });
}

</script>
</body>
</html>
